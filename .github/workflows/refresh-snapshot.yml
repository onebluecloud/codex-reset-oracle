name: refresh-snapshot

# External scheduler: GitHub Actions pings /api/snapshot so the forecast
# re-scrapes its sources every ~30 min, instead of only once a day via the
# Vercel Hobby cron. Adjust the cron below to change the cadence.
on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

# This job only calls a public URL — it needs no repo permissions.
permissions: {}

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh forecast snapshot
        run: |
          curl -sS -m 90 --retry 2 --retry-delay 5 \
            "https://codex-reset-oracle.vercel.app/api/snapshot" \
            -o /dev/null -w "snapshot refresh -> HTTP %{http_code}\n"
